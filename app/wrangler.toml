# Gripfactory Lite. Database ids are placeholders labeled TBD until deploy day.
name = "gripfactory-lite"
main = "src/index.ts"
compatibility_date = "2026-08-28"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
THEME = "grip"
# THE TESTING DESK part 3. Sandbox on this env. The two keys are secrets, never vars.
METRC_API_BASE = "https://sandbox-api-mi.metrc.com"

# Vendored SalesHelper node under public/ (owner ruling 2026-08-31). run_worker_first
# keeps every request on the worker so the PIN gate applies; assets are reachable only
# through routed handlers via the ASSETS binding. html_handling "none" serves exact
# file paths with no trailing-slash redirects. Environments do not inherit this
# block; each env repeats it below.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# Local / default env (wrangler dev). Replace id on deploy day if this env is ever published.
[[d1_databases]]
binding = "DB"
database_name = "gripfactory-lite-local"
database_id = "TBD-local-d1-id"
migrations_dir = "migrations"

[env.grip]
name = "gripfactory-lite-grip"

[env.grip.vars]
THEME = "grip"
# THE SERVICE ACTOR (canon 0.30.140): Cloudflare Access fronts this environment,
# so a request with no login email is a service token's and reads the machine
# doors alone. The default env (wrangler dev, smoke) carries no such var.
ACCESS_FRONTED = "1"
# THE SHEET SYNC (canon 0.30.162): identifiers only. The owner fills these.
# The client secret is a wrangler secret (MS_CLIENT_SECRET), never a var.
# The default env and c10 carry neither of these, and neither carries a cron.
MS_TENANT_ID = "TBD"
MS_CLIENT_ID = "TBD"
# Sandbox until the owner replaces this with the production base. Keys stay secrets.
METRC_API_BASE = "https://sandbox-api-mi.metrc.com"
# THE ENVIRONMENT FLAGS (canon 0.30.246). The email and password are wrangler secrets.
SENSORPUSH_API_BASE = "https://api.sensorpush.com/api/v1"

# A quarter past every hour for the sheet, the mirror and In Testing. Every five
# minutes for the SensorPush pull. The handler tells the two apart by event.cron.
[env.grip.triggers]
crons = ["15 * * * *", "*/5 * * * *", "45 * * * *"]

[env.grip.assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[env.grip.d1_databases]]
binding = "DB"
database_name = "gripfactory-lite-grip-20260914"
database_id = "29c59313-c09b-4b81-b0cc-610150c7803b"
migrations_dir = "migrations"

[env.c10]
name = "gripfactory-lite-c10"

[env.c10.vars]
THEME = "c10"

[env.c10.assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[env.c10.d1_databases]]
binding = "DB"
database_name = "gripfactory-lite-c10"
database_id = "TBD-c10-d1-id"
migrations_dir = "migrations"
